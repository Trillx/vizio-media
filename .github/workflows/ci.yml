name: Test and build
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - run: node --test tests/remote.test.cjs tests/service-link.test.cjs
  secrets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Download and verify Gitleaks
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/gitleaks"
          gh release download v8.30.1 --repo gitleaks/gitleaks \
            --pattern gitleaks_8.30.1_linux_x64.tar.gz \
            --pattern gitleaks_8.30.1_checksums.txt \
            --dir "$RUNNER_TEMP/gitleaks"
          cd "$RUNNER_TEMP/gitleaks"
          sha256sum --check --ignore-missing gitleaks_8.30.1_checksums.txt
          tar -xzf gitleaks_8.30.1_linux_x64.tar.gz
      - name: Scan published Git history
        run: '"$RUNNER_TEMP/gitleaks/gitleaks" git . --redact --no-banner'
  image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Validate Compose configuration
        run: docker compose --env-file .env.example config --quiet
      - name: Build Linux image
        run: docker build --tag vizio-media:ci .
      - name: Start with production restrictions
        run: |
          docker run -d --name vizio-ci --network host \
            --read-only --cap-drop ALL --security-opt no-new-privileges:true \
            --tmpfs /tmp:size=16m,mode=1777 \
            -e VIZIO_BIND_IP=127.0.0.1 -e VIZIO_TV_IP=192.0.2.20 -e VIZIO_PORT=18765 \
            -v vizio-ci-data:/app/data -v vizio-ci-media:/app/media vizio-media:ci
      - name: Check actual HTTP service
        run: python3 scripts/smoke_container.py
      - name: Confirm container health
        run: docker exec vizio-ci python scripts/container_health.py
      - name: Container logs on failure
        if: failure()
        run: docker logs vizio-ci || true
      - name: Clean up test container
        if: always()
        run: docker rm -f vizio-ci || true
