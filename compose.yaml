name: vizio-media
services:
  app:
    build: .
    image: vizio-media:local
    restart: unless-stopped
    # Linux host networking preserves the TV's source IP and host loopback admin access.
    network_mode: host
    environment:
      VIZIO_BIND_IP: ${VIZIO_BIND_IP:?Set VIZIO_BIND_IP in .env}
      VIZIO_TV_IP: ${VIZIO_TV_IP:?Set VIZIO_TV_IP in .env}
      VIZIO_PORT: ${VIZIO_PORT:-8765}
      VIZIO_DATA_DIR: /app/data
      VIZIO_MEDIA_DIR: /app/media
    volumes:
      - app-data:/app/data
      - app-media:/app/media
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 20s
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "2"
volumes:
  app-data:
  app-media:
